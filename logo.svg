<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern in background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="80" y1="16" x2="80" y2="496" />
    <line x1="160" y1="16" x2="160" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="352" y1="16" x2="352" y2="496" />
    <line x1="432" y1="16" x2="432" y2="496" />
    <line x1="16" y1="80" x2="496" y2="80" />
    <line x1="16" y1="160" x2="496" y2="160" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="352" x2="496" y2="352" />
    <line x1="16" y1="432" x2="496" y2="432" />
  </g>

  <!-- Outer Protective Civic Shield & Location Pin Contour -->
  <path d="M 256,72 C 348,72 400,104 400,104 C 400,236 348,360 256,420 C 164,360 112,236 112,104 C 112,104 164,72 256,72 Z" 
        fill="#1E293B" 
        fill-opacity="0.6"
        stroke="url(#shieldGrad)" 
        stroke-width="10" 
        stroke-linejoin="round" />

  <!-- Outer Lens Ring -->
  <circle cx="256" cy="232" r="106" fill="#0B132B" stroke="url(#accentGrad)" stroke-width="7" />

  <!-- Camera Aperture Iris Segments -->
  <path d="M 256,134 L 302,194 L 262,204 Z" fill="#2563EB" opacity="0.95" />
  <path d="M 342,184 L 330,254 L 292,234 Z" fill="#0284C7" opacity="0.95" />
  <path d="M 334,286 L 268,310 L 266,270 Z" fill="#0D9488" opacity="0.95" />
  <path d="M 242,328 L 194,276 L 226,256 Z" fill="#10B981" opacity="0.95" />
  <path d="M 174,260 L 192,194 L 226,218 Z" fill="#3B82F6" opacity="0.95" />
  <path d="M 198,160 L 262,168 L 246,208 Z" fill="#6366F1" opacity="0.95" />

  <!-- Inner High-Tech AI Camera Core -->
  <circle cx="256" cy="232" r="48" fill="url(#lensGrad)" />
  <circle cx="256" cy="232" r="30" fill="#0F172A" opacity="0.5" />
  <circle cx="242" cy="218" r="14" fill="#FFFFFF" opacity="0.75" />
  <circle cx="264" cy="240" r="5" fill="#FFFFFF" opacity="0.5" />

  <!-- AI Pulse Sparkle (Top-Right) -->
  <path d="M 380,118 Q 394,132 394,146 Q 394,132 408,118 Q 394,104 394,90 Q 394,104 380,118 Z" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="394" cy="118" r="3.5" fill="#FFFFFF" />

  <!-- Resolution Checkmark Accent at Base -->
  <path d="M 230,378 L 252,400 L 282,370" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>