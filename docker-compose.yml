version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: civiclens_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: civiclens
      POSTGRES_PASSWORD: civiclens_secret_password
      POSTGRES_DB: civiclens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civiclens_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://civiclens:civiclens_secret_password@db:5432/civiclens
      - SECRET_KEY=civiclens-super-secret-production-key-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DEMO_MODE=${DEMO_MODE:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civiclens_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
